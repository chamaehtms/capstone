<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character Set & Viewport -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Barangay Residents Portal — Barangay Poblacion</title>
    <meta name="title" content="Barangay Residents Portal — Barangay Poblacion" />
    <meta
      name="description"
      content="Official citizen self-service portal for Barangay Poblacion. Register resident profiles, file blotter complaints online, track case resolutions, and receive community announcements."
    />
    <meta name="keywords" content="Barangay Poblacion, resident portal, citizen services, file complaint, blotter report, Katarungang Pambarangay, barangay certificate" />
    <meta name="author" content="Barangay Poblacion LGU" />
    <meta name="application-name" content="Barangay Residents Portal" />
    <meta name="robots" content="index, follow" />

    <!-- Theme Color & Mobile App Meta Tags -->
    <meta name="theme-color" content="#141b4d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Barangay Resident" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="/barangay-seal.png" />
    <link rel="apple-touch-icon" href="/barangay-seal.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Barangay Residents Portal — Barangay Poblacion" />
    <meta
      property="og:description"
      content="Official resident portal for Barangay Poblacion. Submit complaints, track hearing schedules, and stay connected with your local government."
    />
    <meta property="og:image" content="/barangay-seal.png" />
    <meta property="og:image:alt" content="Barangay Poblacion Official Seal" />
    <meta property="og:site_name" content="Barangay Poblacion Residents Portal" />
    <meta property="og:locale" content="en_PH" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Barangay Residents Portal — Barangay Poblacion" />
    <meta
      name="twitter:description"
      content="Official resident portal for Barangay Poblacion. Submit complaints, track hearing schedules, and stay connected with your local government."
    />
    <meta name="twitter:image" content="/barangay-seal.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
