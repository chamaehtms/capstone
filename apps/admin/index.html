<!doctype html>
<html lang="en">
  <head>
    <!-- Character Set & Viewport -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Smart Profiling and Complaint Management System - Barangay Poblacion</title>
    <meta name="title" content="Smart Profiling and Complaint Management System - Barangay Poblacion" />
    <meta
      name="description"
      content="Official administrative dashboard for Barangay Poblacion. Manage resident profiling, blotter complaints, Katarungang Pambarangay mediation hearings, and official records."
    />
    <meta name="keywords" content="Barangay Poblacion, admin dashboard, resident profiling, complaint management, blotter system, Katarungang Pambarangay, Lupon, barangay records" />
    <meta name="author" content="Barangay Poblacion LGU" />
    <meta name="application-name" content="Barangay Poblacion Admin" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Theme Color & Mobile App Meta Tags -->
    <meta name="theme-color" content="#0a1128" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Barangay Admin" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="/barangay-seal.png" />
    <link rel="apple-touch-icon" href="/barangay-seal.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Admin Dashboard — Smart Profiling &amp; Complaint Management System" />
    <meta
      property="og:description"
      content="Administrative portal for Barangay Poblacion officials and staff to manage resident profiles, blotter reports, and mediation sessions."
    />
    <meta property="og:image" content="/barangay-seal.png" />
    <meta property="og:image:alt" content="Barangay Poblacion Official Seal" />
    <meta property="og:site_name" content="Barangay Poblacion Admin" />
    <meta property="og:locale" content="en_PH" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Admin Dashboard — Smart Profiling &amp; Complaint Management System" />
    <meta
      name="twitter:description"
      content="Administrative portal for Barangay Poblacion officials and staff to manage resident profiles, blotter reports, and mediation sessions."
    />
    <meta name="twitter:image" content="/barangay-seal.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            colors: {
              navy: {
                950: '#0a1128',
                900: '#0d1b3e',
                800: '#122252',
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 9999px;
      }
      @media print {
        .admin-sidebar,
        .admin-header,
        .print-hidden,
        .print\:hidden {
          display: none !important;
        }
        body,
        #root,
        .admin-main,
        .letter-paper {
          background: #fff !important;
        }
        .admin-main {
          width: 100% !important;
          padding: 0 !important;
        }
        .letter-paper {
          width: 100% !important;
          max-width: none !important;
          margin: 0 !important;
          padding: 18mm 20mm !important;
          border: 0 !important;
          border-radius: 0 !important;
          box-shadow: none !important;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
