databases:
  - name: barangay-db
    databaseName: barangay_poblacion
    user: barangay_admin
    plan: free

services:
  # ----------------------------------------------------
  # Backend REST API (Node.js Web Service)
  # ----------------------------------------------------
  - type: web
    name: barangay-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate -w @capstone/backend && npm run start -w @capstone/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: barangay-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: barangay-admin
          property: host
      - key: RESIDENT_FRONTEND_URL
        fromService:
          type: web
          name: barangay-resident
          property: host
      - key: CORS_ORIGIN
        value: "*"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: noreply@brgy-poblacion.site

  # ----------------------------------------------------
  # Admin Dashboard (Static Site)
  # ----------------------------------------------------
  - type: web
    name: barangay-admin
    runtime: static
    buildCommand: npm install && npm run build -w @capstone/admin
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: barangay-backend
          property: host
          path: /api

  # ----------------------------------------------------
  # Resident Portal (Static Site)
  # ----------------------------------------------------
  - type: web
    name: barangay-resident
    runtime: static
    buildCommand: npm install && npm run build -w @capstone/resident
    staticPublishPath: ./apps/resident/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: barangay-backend
          property: host
          path: /api
